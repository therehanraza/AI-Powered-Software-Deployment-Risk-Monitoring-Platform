services:
  - type: web
    name: ai-deployment-risk-monitoring-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: deployment_risk_ai
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: FALLBACK_GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production
